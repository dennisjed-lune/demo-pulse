<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lune SDK Expenses</title>
</head>
<body>
<a href="index.html" title="Back to demo home" style="position:fixed;top:18px;left:18px;z-index:99999;display:inline-flex;align-items:center;gap:7px;font:600 13px/1 system-ui,-apple-system,sans-serif;color:#0A634D;background:rgba(255,255,255,.92);border:1px solid #E2E8E6;padding:9px 14px;border-radius:999px;text-decoration:none;box-shadow:0 6px 20px rgba(7,3,18,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)">&#8592;&nbsp;Demo home</a>
<script>if(location.search.indexOf('preview')>-1)document.documentElement.classList.add('is-preview');</script>
<style>.is-preview a[href="index.html"]{display:none!important}@media (max-width:760px){a[href="index.html"]{position:static!important;margin:12px 0 0}}</style>
<style>
/* Layout: prototype stage. A small control panel (bank theme, mode) beside one phone. The phone holds the SDK screen and its sheets.
   Page tokens (--pg-*) belong to the stage. SDK tokens (--*) are the proposed SDK theme: cool neutrals, platform font, bank primary derived in JS. */
:root{
  --pg-bg:#e7eaee;--pg-panel:#ffffff;--pg-ink:#15191e;--pg-muted:#5b636d;--pg-line:#d9dee4;--pg-sel:#15191e;--pg-on-sel:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Roboto,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pg-bg:#0a0b0d;--pg-panel:#16191d;--pg-ink:#eef1f4;--pg-muted:#9aa3ad;--pg-line:#2a2f35;--pg-sel:#eef1f4;--pg-on-sel:#0a0b0d;color-scheme:dark}}
:root[data-theme="dark"]{--pg-bg:#0a0b0d;--pg-panel:#16191d;--pg-ink:#eef1f4;--pg-muted:#9aa3ad;--pg-line:#2a2f35;--pg-sel:#eef1f4;--pg-on-sel:#0a0b0d;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--pg-bg);color:var(--pg-ink)}
body{font-family:var(--font);margin:0;padding-inline:16px;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding-block:24px 40px}
.panel{width:236px;flex:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);background:var(--pg-panel);border:1px solid var(--pg-line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;font-size:12.5px}
.panel b{display:block;font-size:13px}
.panel .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--pg-muted);font-weight:600;margin-bottom:6px}
.panel .opts{display:flex;flex-wrap:wrap;gap:4px}
.panel button{border:1px solid var(--pg-line);background:transparent;border-radius:8px;min-height:32px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;color:var(--pg-muted)}
.panel button[aria-pressed="true"]{background:var(--pg-sel);color:var(--pg-on-sel);border-color:var(--pg-sel)}
.panel i.sw{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px var(--pg-panel),0 0 0 2.5px var(--pg-line)}
.panel p{margin:0;color:var(--pg-muted);line-height:1.45}
@media (max-width:760px){.stage{flex-direction:column;align-items:center;gap:14px;padding-block:12px 24px}.panel{position:static;width:100%;max-width:390px}}

/* ===== phone ===== */
.phone{width:390px;max-width:100%;height:844px;border-radius:52px;background:#0b0b0c;padding:10px;box-shadow:0 18px 50px rgba(10,20,30,.22);flex:none}
@media (max-width:430px){.phone{height:780px;border-radius:40px;padding:6px}}
.dev{
  --bg:#f4f6f8;--card:#ffffff;--line:#e2e6ea;--chip:#eceff3;--ink:#15191e;--ink2:#5b636d;--ink3:#8a929c;--n300:#d3d9df;--scrim:rgba(10,14,20,.36);
  --pos:#13723d;--pos-bg:#e7f5ec;--neg:#b42318;--neg-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fbf0d9;
  --p:#1c3d7a;--p-text:#1c3d7a;--on-p:#fff;--tint:#eef1f6;--tint2:#ccd4e2;
  height:100%;border-radius:42px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
@media (max-width:430px){.dev{border-radius:34px}}
.dev.dark{--bg:#0e1013;--card:#181b1f;--line:#2a2e34;--chip:#22262b;--ink:#f1f3f5;--ink2:#aab2bb;--ink3:#858d97;--n300:#3e434a;--scrim:rgba(0,0,0,.55);
  --pos:#6fd394;--pos-bg:#12291b;--neg:#ff8a80;--neg-bg:#331614;--warn:#f0c060;--warn-bg:#2e2410;color-scheme:dark}
.status{height:50px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:15px;font-weight:600}
.status svg{display:block}
.host{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px dashed var(--line)}
.host .back{width:36px;height:36px;display:grid;place-items:center;color:var(--p-text)}
.host .bank{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-weight:500}
.host .mark{width:22px;height:22px;border-radius:7px;background:var(--p);color:var(--on-p);display:grid;place-items:center;font-size:11px;font-weight:700}
.host .tagsdk{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:500}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.dev button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.dev :focus-visible{outline:2px solid var(--p-text);outline-offset:2px;border-radius:8px}

h1.t{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pager{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;height:44px}
.pager .arr{width:44px;height:44px;display:grid;place-items:center;color:var(--ink2);border-radius:50%}
.pager .arr[disabled]{color:var(--n300);cursor:default}
.pager .lbl{font-size:14px;font-weight:600;padding:0 2px;min-width:0;white-space:nowrap;display:flex;align-items:center;gap:4px;height:44px}
.hero small{display:block;font-size:13px;color:var(--ink2);font-weight:500}
.amt{font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;display:flex;align-items:baseline;gap:6px}
.amt .num{white-space:nowrap}
.amt .cur{font-size:15px;font-weight:600;color:var(--ink2);letter-spacing:0}
.amt .dec{font-size:20px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;margin-top:8px}
.chip.pos{background:var(--pos-bg);color:var(--pos)}.chip.neg{background:var(--neg-bg);color:var(--neg)}.chip.n{background:var(--chip);color:var(--ink2)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip svg{width:13px;height:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card.flush{padding:4px 14px}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sec h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.link{color:var(--p-text);font-size:14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;padding:0 2px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.chead{display:grid;gap:2px;margin-bottom:8px}
.chead b{font-size:15px;font-weight:600}
.chead small{font-size:12.5px;color:var(--ink2)}
.legend.lv{display:grid;gap:6px;font-size:13px}
.legend.lv span{display:flex}
.legend.lv b{margin-left:auto;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.legend i.dash{background:none;border-top:2px dashed var(--ink3);height:0}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:60px;padding:8px 0;border-bottom:1px solid var(--line);width:100%}
.rows>.row:last-child{border-bottom:0}
.row.rk{grid-template-columns:40px minmax(0,1fr);padding:12px 0}
.rk .l1,.rk .l2{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rk .l1 .nm{min-width:0}
.rk .amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk .l2{font-size:12.5px;color:var(--ink2);margin-top:6px}
.rk .l2>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .l2>span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.row .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .bar{display:block;height:4px;border-radius:2px;background:var(--chip);margin-top:7px;overflow:hidden}
.row .bar i{display:block;height:100%;border-radius:2px}
.row .v{min-width:86px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;white-space:nowrap}
.row .v small{display:block;font-size:12px;color:var(--ink2);font-weight:500;margin-top:2px}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px}
.logo{width:40px;height:40px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;flex:none;display:grid;place-items:center}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.mono{width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--ink2);display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.more{width:100%;min-height:44px;font-size:14px;font-weight:600;color:var(--p-text);text-align:center!important;border-top:1px solid var(--line)}
.note{font-size:12.5px;color:var(--ink2);text-align:center;padding:0 12px}
.empty{text-align:center;padding:24px 8px;color:var(--ink2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.chart{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);font-variant-numeric:tabular-nums}
.chartwrap{position:relative}

/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden}
.sheet.on{visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;top:58px;background:var(--card);border-radius:22px 22px 0 0;z-index:21;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--n300);margin:8px auto 2px;flex:none}
.shead{display:flex;align-items:center;gap:10px;padding:4px 12px 8px;flex:none;min-height:52px}
.shead .hb{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);flex:none}
.shead .hb.x span{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.shead .ttl{flex:1;min-width:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .ttl small{display:block;font-size:12.5px;color:var(--ink2);font-weight:500}
.shead .sp{width:44px;flex:none}
.sbody{flex:1;overflow-y:auto;padding:4px 16px 28px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.sfoot{flex:none;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.idrow{display:flex;align-items:center;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:999px;background:var(--p)!important;color:var(--on-p);font-size:16px;font-weight:700}
.btn[disabled]{opacity:.45;cursor:default}
.btn2{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:999px;border:1.5px solid var(--line)!important;color:var(--ink);font-size:15px;font-weight:600}
.group{background:var(--bg);border-radius:14px;padding:2px 14px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line);font-size:15px;width:100%}
.group .kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
.kv .r{display:flex;align-items:center;gap:8px;font-weight:600;text-align:right}
.kv .r svg{width:16px;height:16px;color:var(--ink3)}
.lbl{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px;display:block}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.dev .tag{height:36px;border-radius:999px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;border:1px solid var(--line)!important;color:var(--ink)}
.dev .tag.on{background:var(--tint)!important;border-color:var(--tint2)!important;color:var(--p-text)}
textarea.f,input.f,select.f{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;color:var(--ink);resize:none}
textarea.f:focus,input.f:focus,select.f:focus{outline:2px solid var(--p-text);outline-offset:0;border-color:transparent}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:0 14px;height:46px}
.search svg{width:18px;height:18px;color:var(--ink3);flex:none}
.dev button.sbtn{width:100%;color:var(--ink3);font-size:16px;margin:2px 0 8px;padding:0 14px;border:1px solid var(--line);background:var(--card);justify-content:flex-start}
.search input{border:0;background:transparent;outline:0;font-size:16px;flex:1;min-width:0;color:var(--ink)}
.day{font-size:12.5px;font-weight:600;color:var(--ink2);margin:6px 0 0;text-transform:uppercase;letter-spacing:.04em}
.radio{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line);width:100%;font-size:15px;font-weight:500}
.group .radio:last-child{border-bottom:0}
.radio .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--n300);flex:none;display:grid;place-items:center}
.radio[aria-checked="true"] .dot{border-color:var(--p)}
.radio[aria-checked="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--p)}
.radio .rs{margin-left:auto;color:var(--ink2);font-size:13px}
.txhead{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:4px}
.txhead .logo,.txhead .mono,.txhead .ic{width:64px;height:64px;border-radius:18px}
.txhead .ic svg{width:30px;height:30px}
.txhead .mono{font-size:24px}
.txhead .nm{font-size:17px;font-weight:600}
.txhead .amt{font-size:32px}
.txhead small{font-size:13px;color:var(--ink2)}
/* range picker */
.rf{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.dev .rf button{border:1.5px solid var(--line)!important;border-radius:12px;padding:8px 12px;min-height:56px;text-align:left!important;background:var(--bg)!important}
.dev .rf button.cur{border-color:var(--p)!important}
.rf small{display:block;font-size:11.5px;color:var(--ink2);font-weight:600}
.rf b{font-size:15px;font-weight:600}
.rf b.ph{color:var(--ink3);font-weight:500}
.calh{display:flex;align-items:center;justify-content:space-between}
.calh b{font-size:15px}
.calh button{width:44px;height:44px;display:grid;place-items:center;color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;text-align:center}
.cal .wd{font-size:11.5px;color:var(--ink3);font-weight:600;padding:4px 0}
.cal button{height:44px;display:grid;place-items:center;font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums;position:relative}
.cal button[disabled]{color:var(--n300);cursor:default}
.cal button.in{background:var(--tint)}
.cal button.s,.cal button.e{color:var(--on-p)}
.cal button.s::before,.cal button.e::before{content:"";position:absolute;width:40px;height:40px;border-radius:50%;background:var(--p);z-index:0}
.cal button span{position:relative;z-index:1}
.cal button.today span{text-decoration:underline;text-underline-offset:3px}
.sumline{font-size:13.5px;color:var(--ink2);text-align:center;min-height:20px}
.hint{font-size:12.5px;color:var(--ink2)}
.toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.dev .row:active,.dev .kv:active,.dev .radio:active{background:var(--chip)}
.dev .btn:active,.dev .btn2:active,.dev .tag:active,.dev .link:active,.dev .more:active,.dev .seg button:active,.dev .pager button:active,.dev .hb:active{opacity:.72}
.panel button:active{opacity:.75}
.slot{border:1.5px dashed var(--n300);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;color:var(--ink2);font-size:13px}
.slot b{color:var(--ink);font-size:14px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools .seg{flex:1;min-width:150px}
.dev .fbtn{height:42px;border-radius:999px;border:1px solid var(--line);padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink)}
.dev .fbtn.on{border-color:var(--p);color:var(--p-text);background:var(--tint)}
.dev .sw{display:inline-flex;align-items:center;gap:8px;height:42px;font-size:13.5px;font-weight:600;color:var(--ink)}
.sw .tr{width:40px;height:24px;border-radius:12px;background:var(--n300);position:relative;transition:background .15s}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.sw[aria-checked="true"] .tr{background:var(--p)}
.sw[aria-checked="true"] .tr::after{transform:translateX(16px)}
.count{font-size:12.5px;color:var(--ink2)}
.check{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line);width:100%;font-size:15px}
.group .check:last-child{border-bottom:0}
.check .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--n300);display:grid;place-items:center;flex:none;margin-left:auto}
.check[aria-checked="true"] .box{background:var(--p);border-color:var(--p);color:var(--on-p)}
.dev .fchip{flex:none;height:36px;border-radius:999px;padding:0 14px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2)}
.dev .fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.foot2{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.raw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:500;color:var(--ink2);text-align:right;word-break:break-all}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--n300);border-radius:16px;min-height:150px;cursor:pointer;color:var(--ink2);font-size:14px;text-align:center;padding:12px}
.upload img{width:72px;height:72px;border-radius:16px;object-fit:cover;border:1px solid var(--line)}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.pick{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line);width:100%;font-size:15px}
.group .pick:last-child{border-bottom:0}
.pick .cv{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13.5px}
.pick .cv .logo,.pick .cv .mono,.pick .cv .ic{width:28px;height:28px;border-radius:8px;font-size:12px}
.dev .fbtn:active,.dev .sw:active,.dev .fchip:active{opacity:.72}
.dev .check:active,.dev .pick:active{background:var(--chip)}
.sbody>*,.scroll>*{flex-shrink:0}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dev .tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-height:96px}
.tcard .ic{width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--p-text)}
.tcard b{font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tcard small{font-size:12.5px;color:var(--ink2)}
.dev .pchip{height:40px;border-radius:999px;border:1px solid var(--line);padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink);background:var(--card)}
.sheadrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sortbar{display:flex;gap:8px}
.dev .sortb{height:36px;border-radius:999px;padding:0 12px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:4px}

.ctile .t2{font-size:12.5px;color:var(--ink2);margin-top:3px}
.ctile .t2 span:last-child{display:inline-flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.ctile .bar{display:block;height:6px;border-radius:3px;margin-top:8px;overflow:hidden}
.ctile .bar i{display:block;height:100%;border-radius:3px}
.amtbtn{display:block;text-align:left}

.donut .ctr small{font-size:12px;color:var(--ink2);font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dhint{font-size:12px;color:var(--ink2);text-align:center;margin:0 0 4px}
.row.dim{opacity:.45}
.sk{background:linear-gradient(90deg,var(--chip) 25%,var(--line) 50%,var(--chip) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:12px}

.disc{font-size:12.5px;color:var(--ink2);margin:-2px 0 8px}
.step{margin:0;font-size:14px;font-weight:500;color:var(--ink2);text-align:center}
.dev .rf button.cur{box-shadow:0 0 0 1px var(--p)}

/* ---------- main page ---------- */
function rankCats(a,b){const m={};txIn(a,b).forEach(t=>{const c=catOf(t);(m[c]=m[c]||{v:0,n:0});m[c].v+=t.a;m[c].n++});return Object.entries(m).map(([id,x])=>({id,...x})).sort((x,y)=>y.v-x.v)}
function rankMer(a,b,f){const m={};txIn(a,b,f).forEach(t=>{(m[t.m]=m[t.m]||{v:0,n:0});m[t.m].v+=t.a;m[t.m].n++});return Object.entries(m).map(([id,x])=>({id,...x})).sort((x,y)=>y.v-x.v)}
const savTxt=t=>SAVE[t.id]?`<small style="color:var(--pos)">AED ${n2(SAVE[t.id])} cashback</small>`:'';
const STL={reported:['var(--warn)','Pending'],updated:['var(--pos)','Updated'],closed:['var(--ink2)','Report closed']};
function txRow(t,showCat,byDate){const c=CAT[catOf(t)],st=statusOf(t),rep=st?`<span style="color:${STL[st][0]}">${STL[st][1]}</span>`:'';

  return`<button class="row" data-a="tx" data-v="${t.id}"><span>${mark(t.m)}</span><span style="min-width:0"><span class="nm" style="display:block">${esc(t.m)}</span><span class="sub" style="display:block">${showCat?esc(c.n)+' · ':''}${fd(t.d)}</span></span><span class="v">${n2(t.a)}${rep?`<small>${rep}</small>`:savTxt(t)}</span></button>`}
function renderMain(){

    chart=`<div class="card"><div class="chead"><b>Spending added up, day by day</b><small>${curL} against ${['Last month','Previous period'].includes(prevL)?prevL.toLowerCase():prevL}${r.cur?', compared on the same day':''}</small></div><div class="chartwrap" id="pacewrap">${pc.svg}<div class="tip" id="tip" hidden></div></div>`
     +`<div class="legend lv"><span><i style="background:var(--p)"></i>${curL}${r.cur?` to ${fd(r.b)}`:''}<b>${aed(tot)}</b></span><span><i class="dash"></i>${prevL}${r.cur?` to ${fd(pdd)}`:''}<b>${aed(pvSum)}</b></span></div></div>`;
  }else if(r.kind==='last'){

  }

    const sel=S.dsel&&segs.some(x=>x.id===S.dsel)?S.dsel:null,ss=sel&&segs.find(x=>x.id===sel);
    stack=`<div class="donut">${donutSvg(segs,tot,sel)}<button class="ctr" data-a="${sel?(sel==='others'?'others':'catbrands'):'dclear'}" data-v="${sel||''}" aria-label="${ss?`Open ${esc(ss.n)}`:'Total spend'}">${ss?`<small>${esc(ss.n)}</small><b>${compact(ss.v)}</b><i>${Math.round(ss.v/tot*100)}% of spend</i>`:`<small>Spent</small><b>${compact(tot)}</b><small>AED</small>`}</button></div><p class="dhint">${ss?`Tap ${esc(ss.n)} again to see its ${sel==='others'?'categories':'brands'}.`:'Tap a category to see its share.'}</p>`;
    rows=five.map(x=>{const c=CAT[x.id];return rkRow('catbrands',x.id,catIc(c),esc(c.n),n0(x.v),(x.v/top*100).toFixed(1),hue(c),txns(x.n),shareP(x.v,tot))}).join('')
     +(rest.length?rkRow('others','',`<span class="mono">${I('dots')}</span>`,'Others',n0(rv),null,null,`${rest.length} more categor${rest.length>1?'ies':'y'}`,shareP(rv,tot)):'');}

  hero=hero.replace(bigAmt(tot),heroAmt(tot));
  main.innerHTML=`${titleRow}
   ${tot>0?hero+chart:`<div class="card empty"><div class="donut" style="width:150px">${`<svg viewBox="0 0 200 200" role="img" aria-label="No spend"><circle cx="100" cy="100" r="84" fill="none" stroke="var(--chip)" stroke-width="18"/></svg>`}<div class="ctr" style="pointer-events:none"><small>Spent</small><b>0</b></div></div><b>No spend</b>You have no spending in this period. Choose another period.</div>`}
   ${tot>0?`<section><div class="sec"><h2>Where it went</h2></div>
     <div class="seg" role="group" aria-label="Group spend by"><button data-a="tab" data-v="cat" aria-pressed="${S.tab==='cat'}">Categories</button><button data-a="tab" data-v="mer" aria-pressed="${S.tab==='mer'}">Brands</button></div>
     <div class="card flush" style="margin-top:10px">${stack}<div class="rows">${rows}</div><button class="more" data-a="${S.tab==='cat'?'breakdown':'brands'}">View all ${list.length} ${S.tab==='cat'?'categories':'brands'}</button></div></section>`:''}
   <div class="slot" aria-label="Bank content slot"><b>Bank content slot</b>The bank can show its own view here, for example card offers. It is optional.</div>
   <section><div class="sec"><h2>Transactions</h2><button class="link" data-a="all" ${recent.length?'':'disabled style="color:var(--ink3)"'}>View all</button></div>
     ${recent.length?`<button class="search sbtn" data-a="searchall">${I('search',18)}<span>Search transactions</span></button>`:''}
     <p class="disc">Transfers between your own accounts are not counted as spend.</p>
     <div class="card flush"><div class="rows">${recent.length?recent.map(t=>txRow(t,true)).join(''):'<div class="empty">No transactions in this period</div>'}</div></div></section>`;
  bindPace();

let PACE=null;
function bindPace(){const w=document.getElementById('pacewrap');if(!w||!PACE)return;const svg=w.querySelector('svg'),tip=document.getElementById('tip');
  const mv=e=>{const rc=svg.getBoundingClientRect(),x=(e.clientX-rc.left)/rc.width*PACE.W;let best=0,bd=1e9;PACE.cur.forEach((_,i)=>{const d=Math.abs(PACE.X(i)-x);if(d<bd){bd=d;best=i}});
    const d=new Date(PACE.a.getTime()+best*DAY),pv=PACE.pr[best];tip.hidden=false;tip.style.left=(PACE.X(best)/PACE.W*rc.width)+'px';tip.style.top=(PACE.Y(PACE.cur[best])/PACE.H*rc.height)+'px';
    tip.textContent=`${fd(d)}: ${aed(PACE.cur[best])}${pv!=null?` · last month ${aed(pv)}`:''}`};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',()=>tip.hidden=true);}

/* ---------- sheet views ---------- */
function headBar(title,sub){const back=S.stack.length>1;
  return`<div class="grab" aria-hidden="true"></div><div class="shead">${back?`<button class="hb" data-a="back" aria-label="Back">${I('chevL',22)}</button>`:'<span class="sp"></span>'}<div class="ttl" id="sheet-title">${title}${sub?`<small>${sub}</small>`:''}</div><button class="hb x" data-a="close" aria-label="Close"><span>${I('x',16)}</span></button></div>`}
function sixCycles(selOff,f){const items=[];const end=Math.min(0,selOff+2);const start=Math.max(MINOFF,end-5);for(let o=start;o<=end;o++){const c=cycle(o);items.push({l:cycShort(c)+(c.cur?'*':''),v:sum(txIn(c.a,c.b,f)),key:o,partial:c.cur})}return items}
function trendBlock(view,f,what){const off=view.off;const c=cycle(off);const items=sixCycles(off,f);const sel=items.findIndex(x=>x.key===off);
  const full=items.filter(x=>!x.partial&&x.key!==off);const avg=full.length?sum(full.map(x=>({a:x.v})))/full.length:0;
  const v=sum(txIn(c.a,c.b,f));

function tqList(v,L,brand){if(!L.length)return'<div class="empty"><b>No results</b>Try another search.</div>';return L.slice(0,8).map(t=>brand?txRow(t,false,true):txRow(t,false)).join('')+(L.length>8&&!brand?`<button class="more" data-a="allcat" data-v="${v.id}">See all ${L.length} transactions</button>`:'')+(L.length>8&&brand?`<p class="count" style="text-align:center">Showing 8 of ${L.length}. Search to find more.</p>`:'')}

   case'close':closeSheet();break;
   case'pickcat':push({v:'pickcat',id:v,cur:tp.d?tp.d.cat:null});break;
   case'setcat':{const[id,c]=v.split('|');S.stack.pop();const tv=top();if(tv&&tv.v==='tx')tv.d.cat=c;renderSheet();break;}
   case'tag':case'untag':{const a0=tp.d.tags.filter(y=>y!==v);if(a==='tag')a0.push(v);tp.d.tags=a0;renderSheet(true);break;}
   case'report':push({v:'report',id:v});break;
   case'rstep':push({v:'report',id:tp.id,step:v});break;
   case'rcat':tp.val=v;renderSheet(true);break;
   case'rsubmit':{const id=tp.id;S.over[id]={...(S.over[id]||{}),rep:v,status:'reported'};while(top()&&top().v==='report')S.stack.pop();renderSheet();renderMain();toast('Report sent. We will update you here.');break;}
   case'unreport':{delete S.over[v].rep;delete S.over[v].status;renderSheet(true);renderMain();toast('Report cancelled');break;}
   case'payday':push({v:'payday',sel:S.payday,start:true});break;
   case'pdday':tp.sel=+v;renderSheet(true);break;
   case'pdstart':tp.start=!tp.start;renderSheet(true);break;
   case'pdsave':{S.payday=tp.sel;S.suggest=false;if(tp.start)S.startDay=tp.sel;S.stack.pop();const pv=top();if(pv&&pv.draft)pv.draft.sd=S.startDay;renderSheet();loadMain();toast(`Salary day set to the ${ord(tp.sel)}${tp.start?'. Your month starts on that day.':''}`);break;}
   case'cats':push({v:'cats'});break;
   case'catbrands':push({v:'brands',cat:v});break;
   case'cmode':tp.cm=v;tp.day=null;renderSheet(true);break;
   case'gocycs':S.period={k:'cyc',off:+v};loadMain();renderSheet(true);break;
   case'unscopeb':tp.cat=null;tp.day=null;renderSheet(true);break;
   case'dseg':if(S.dsel!==v){S.dsel=v;renderMain();break}if(v==='others')push({v:'cats',others:true});else push({v:'brands',cat:v});break;
   case'dclear':S.dsel=null;renderMain();break;
   case'mini':S.mini=!S.mini;renderMain();if(S.stack.length)renderSheet(true);break;
   case'others':push({v:'cats',others:true});break;
   case'breakdown':push({v:'cats'});break;
   case'bsort':S.bsort=S.bsort.k===v?{k:v,d:S.bsort.d==='asc'?'desc':'asc'}:{k:v,d:v==='name'?'asc':'desc'};renderSheet(true);break;
   case'allcat':push({v:'all',cat:v});break;
   case'unscope':tp.cat=null;renderSheet(true);break;
   case'loadmore':tp.lim=(tp.lim||30)+30;renderSheet(true);break;
   case'rbpick':tp.val=v;renderSheet(true);break;
   case'txsave':{const t=TXI[tp.id],d=tp.d,o={...(S.over[t.id]||{})};if(d.cat!==t.cat)o.cat=d.cat;else delete o.cat;o.tags=[...d.tags];o.note=d.note;S.over[t.id]=o;renderMain();renderSheet(true);toast('Saved');break;}
   case'brands':push({v:'brands'});break;
   case'filter':push({v:'filter',t:v,d:JSON.parse(JSON.stringify(S.f[v]))});break;
   case'fcat':{const a=tp.d.cats,i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);renderSheet(true);break;}
   case'ftag':{const a=tp.d.tags,i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);renderSheet(true);break;}
   case'freset':tp.d={cats:[],tags:[]};tp.q='';renderSheet(true);break;
   case'fapply':{S.f[tp.t]=tp.d;S.stack.pop();renderSheet();toast('Filters applied');break;}
   case'freset2':S.f[v]={cats:[],tags:[]};renderSheet(true);break;
   case'sortc':S.sortCats=v;renderSheet(true);break;
   case'sorta':S.sortAll=v;renderSheet(true);break;
   case'reponly':S.repOnly=!S.repOnly;renderSheet(true);break;
   case'bday':tp.day=tp.day===+v?null:+v;renderSheet(true);break;
   case'applyp':{const d=tp.draft;
     S.period=['cyc0','cyc1','last3','last6'].includes(d.k)?presetPeriod(d.k):{k:'range',a:d.s,b:d.e||d.s};
     S.allCats=false;S.stack.pop();if(S.stack.length){renderSheet();loadMain()}else{closeSheet();loadMain()}break;}
  }
});
scrim.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.stack.length){if(S.stack.length>1){S.stack.pop();renderSheet();focusSheet()}else closeSheet()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const tmp=document.createElement('div');tmp.innerHTML=viewAll(top());document.getElementById('allwrap').innerHTML=tmp.querySelector('#allwrap').innerHTML;const h=document.querySelector('#sheet .hero');if(h)h.innerHTML=tmp.querySelector('.hero').innerHTML}
  if(e.target.id==='tq'){const tv=top();tv.q=e.target.value;const tmp=document.createElement('div');tmp.innerHTML=VIEWS[tv.v](tv);document.getElementById('tqlist').innerHTML=tmp.querySelector('#tqlist').innerHTML}
  if(e.target.id==='fs'){top().q=e.target.value;const tmp=document.createElement('div');tmp.innerHTML=viewFilter(top());document.getElementById('fcats').innerHTML=tmp.querySelector('#fcats').innerHTML}
  if(e.target.id==='rb'){top().val=e.target.value.trim();document.getElementById('rbsend').disabled=!top().val;document.getElementById('rbsug').innerHTML=brandSug(top().val,TXI[top().id].m)}
  if(e.target.id==='note'){const tv=top();tv.d.note=e.target.value;const b=document.getElementById('txsave');if(b)b.disabled=!txDirty(tv)}});
document.addEventListener('change',e=>{if(e.target.id==='rl'&&e.target.files&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>{top().img=fr.result;renderSheet(true)};fr.readAsDataURL(e.target.files[0]);return}if(e.target.id==='sday'&&top()&&top().draft){top().draft.sd=+e.target.value;const old=S.startDay;S.startDay=+e.target.value;renderSheet(true);S.startDay=old;}});
// swipe down on grab area closes or goes back
(function(){let y0=null;sheet.addEventListener('pointerdown',e=>{if(e.target.closest('.grab,.shead')&&!e.target.closest('button'))y0=e.clientY});
  sheet.addEventListener('pointerup',e=>{if(y0!=null&&e.clientY-y0>60)closeSheet();y0=null});})();

/* ---------- control panel ---------- */
const bk=document.getElementById('banks');bk.innerHTML=BANKS.map((b,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===0}"><i class="sw" style="background:${b[2]}"></i>${b[1]}</button>`).join('');
bk.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.bank=+b.dataset.i;bk.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
const md=document.getElementById('modes');md.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.dark=b.dataset.m==='dark';md.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
document.getElementById('reset').addEventListener('click',()=>{const b=S.bank,d=S.dark;S=fresh();S.bank=b;S.dark=d;sheet.classList.remove('on');scrim.classList.remove('on');sheet.innerHTML='';render();main.scrollTop=0});
render();
})();
</script>
</body>
</html>
